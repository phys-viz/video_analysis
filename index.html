        if(!Number.isFinite(y)){started=false;continue;}
        const X=px(x),Y=py(y);
        // Clip vertically rather than letting a steep model shoot off-canvas.
        if(Y<m.t-500||Y>H-m.b+500){started=false;continue;}
        if(!started){gctx.moveTo(X,Y);started=true;}else gctx.lineTo(X,Y);
      }
      gctx.stroke();
      gctx.restore();
    }

    // Expose the mapping so the brush can convert pixels back to data.
    lastPlot={px,py,xmin,xmax,ymin,ymax,m,W,H};

    // Graph title
    gctx.fillStyle=style.color;
    gctx.font='700 20px system-ui, -apple-system, Segoe UI, sans-serif';
    gctx.textAlign='center';
    gctx.textBaseline='top';
    gctx.fillText(style.title,(m.l+W-m.r)/2,5);

    // Axis labels
    gctx.fillStyle='#111827';
    gctx.font='600 19px system-ui, -apple-system, Segoe UI, sans-serif';
    gctx.textAlign='center';
    gctx.textBaseline='alphabetic';
    gctx.fillStyle=(style.title==='y vs x')?'#38bdf8':style.color;
    gctx.fillText(xlab,(m.l+W-m.r)/2,H-18);

    gctx.save();
    gctx.fillStyle=(style.title==='y vs x')?'#22c55e':style.color;
    gctx.translate(24,(m.t+H-m.b)/2);
    gctx.rotate(-Math.PI/2);
    gctx.fillText(ylab,0,0);
    gctx.restore();

    // Tick labels with scale-appropriate decimals.
    const xDec=tickDecimals(xTicks.step);
    const yDec=tickDecimals(yTicks.step);

    gctx.font='600 14px system-ui, -apple-system, Segoe UI, sans-serif';
    gctx.fillStyle='#273244';
    gctx.textAlign='center';
    gctx.textBaseline='top';
    xTicks.values.forEach(v=>{
      if(v<xmin-1e-12||v>xmax+1e-12)return;
      const label=Math.abs(v)<1e-12?0:v;
      gctx.fillText(label.toFixed(xDec),px(v),H-m.b+10);
    });

    gctx.textAlign='right';
    gctx.textBaseline='middle';
    yTicks.values.forEach(v=>{
      if(v<ymin-1e-12||v>ymax+1e-12)return;
      const label=Math.abs(v)<1e-12?0:v;
      gctx.fillText(label.toFixed(yDec),m.l-11,py(v));
    });
  }

  function saveProject(){
    const payload={format:'Manual Video Analysis Project',version:1,video:{name:state.videoName,size:state.videoSize,duration:state.videoDuration,width:video.videoWidth||null,height:video.videoHeight||null},fps:state.fps,stride:state.stride,calibration:state.calibration,calibrationVisible:state.calibrationVisible,origin:state.origin,angle:state.angle,axesVisible:state.axesVisible,points:state.points,selection:state.selection,fitModels:state.fitModels,pointDisplay:state.pointDisplay,recentCount:state.recentCount,autoAdvance:state.autoAdvance,timeOrigin:state.timeOrigin,graphLimits:state.graphLimits,graphLimitsManual:state.graphLimitsManual};
    download(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),(state.videoName.replace(/\.[^.]+$/,'')||'video-analysis')+'.mva');
  }
  function loadProject(file){
    const fr=new FileReader();
    fr.onload=()=>{try{
      const p=JSON.parse(fr.result);
      state.fps=p.fps||30;state.stride=p.stride||1;state.calibration=p.calibration||null;state.calibrationVisible=p.calibrationVisible!==false;state.origin=p.origin||state.origin;state.angle=p.angle||0;state.axesVisible=p.axesVisible!==false;state.points=p.points||[];state.selection=Array.isArray(p.selection)&&p.selection.length?p.selection:null;state.fitModels=(p.fitModels&&typeof p.fitModels==='object')?p.fitModels:(p.fitModel&&p.fitModel!=='none'?{y:p.fitModel}:{});state.pointDisplay=p.pointDisplay||'recent';state.recentCount=p.recentCount||5;state.autoAdvance=p.autoAdvance!==false;state.timeOrigin=p.timeOrigin||'first';state.graphLimits=p.graphLimits||state.graphLimits;state.graphLimitsManual=Boolean(p.graphLimitsManual);
      fpsWasUserSet=true;
      $('fpsInput').value=state.fps;$('strideInput').value=state.stride;$('pointDisplay').value=state.pointDisplay;$('autoAdvance').value=state.autoAdvance?'1':'0';$('timeOrigin').value=state.timeOrigin;populateLimitInputs();updateLimitLabels();
      // The calibration fields showed stale values after a load, and editing one
      // then silently rewrote a calibration the student had not touched.
      syncCalibrationInputs();
      pruneSelection();
      updateSelectionBar();
      $('fitSelect').value=currentFitModel();
      state.expectedVideo=p.video||null;
      draw();
      alert(p.video?.name?`Project loaded. Select the original video file: ${p.video.name}`:'Project loaded. Select its video file.');
    }catch(e){alert('Could not open project file.');}};
    fr.readAsText(file);
  }


  // Repainting the graph from a table drag would run on every pointermove;
  // coalesce onto an animation frame like the other outputs.
  let highlightQueued=false;
  function scheduleGraphHighlight(){
    if(highlightQueued) return;
    highlightQueued=true;
    requestAnimationFrame(()=>{highlightQueued=false;drawGraph();});
  }

  const tableSelection={
    active:false,
    anchor:null,
    focus:null,
    selectedColumns:new Set(),
    lastHeaderColumn:null,
    suppressNextClick:false
  };

  function tableCellPosition(cell){
    const row=cell.parentElement;
    const section=row.parentElement.tagName.toLowerCase();
    const rowIndex=Array.from(row.parentElement.children).indexOf(row);
    return {
      row:section==='thead'?0:rowIndex+1,
      col:Array.from(row.children).indexOf(cell)
    };
  }

  // Which data rows the spreadsheet selection currently covers. Returned as a
  // Set of frames so the graph can highlight exactly those points.
  function tableSelectedFrames(){
    const bodyRows=$('dataBody').rows;
    if(!bodyRows.length) return null;
    const frameOf=i=>{
      const tr=bodyRows[i];
      return tr&&tr.dataset.frame!==undefined?Number(tr.dataset.frame):null;
    };
    // A whole-column selection covers every row, which is the same as no
    // highlight at all - so treat it as nothing rather than lighting up all.
    if(tableSelection.selectedColumns.size) return null;
    if(!tableSelection.anchor||!tableSelection.focus) return null;
    const r1=Math.min(tableSelection.anchor.row,tableSelection.focus.row);
    const r2=Math.max(tableSelection.anchor.row,tableSelection.focus.row);
    const frames=new Set();
    for(let r=r1;r<=r2;r++){
      // Row 0 is the header; body rows start at 1.
      if(r===0) continue;
      const f=frameOf(r-1);
      if(f!==null) frames.add(f);
    }
    return frames.size?frames:null;
  }

  function tableCellAt(row,col){
    const table=$('dataTab').querySelector('table');
    return row===0
      ? table.tHead?.rows[0]?.cells[col]||null
      : table.tBodies[0]?.rows[row-1]?.cells[col]||null;
  }

  function clearTableSelection(){
    $('dataTab').querySelectorAll('.cell-selected,.selection-anchor').forEach(cell=>{
      cell.classList.remove('cell-selected','selection-anchor');
    });
  }

  function paintTableSelection(){
    clearTableSelection();
    // Keep the graph's highlight in step with the spreadsheet selection.
    scheduleGraphHighlight();
    const table=$('dataTab').querySelector('table');

    if(tableSelection.selectedColumns.size){
      const lastRow=table.tBodies[0].rows.length;
      [...tableSelection.selectedColumns].forEach(col=>{
        for(let row=0;row<=lastRow;row++){
          const cell=tableCellAt(row,col);
          if(cell)cell.classList.add('cell-selected');
        }
      });
      if(tableSelection.lastHeaderColumn!==null){
        const anchor=tableCellAt(0,tableSelection.lastHeaderColumn);
        if(anchor)anchor.classList.add('selection-anchor');
      }
      return;
    }

    if(!tableSelection.anchor||!tableSelection.focus)return;
    const r1=Math.min(tableSelection.anchor.row,tableSelection.focus.row);
    const r2=Math.max(tableSelection.anchor.row,tableSelection.focus.row);
    const c1=Math.min(tableSelection.anchor.col,tableSelection.focus.col);
    const c2=Math.max(tableSelection.anchor.col,tableSelection.focus.col);

    for(let r=r1;r<=r2;r++){
      for(let c=c1;c<=c2;c++){
        const cell=tableCellAt(r,c);
        if(cell)cell.classList.add('cell-selected');
      }
    }
    const anchor=tableCellAt(tableSelection.anchor.row,tableSelection.anchor.col);
    if(anchor)anchor.classList.add('selection-anchor');
  }

  function selectedTableText(){
    const table=$('dataTab').querySelector('table');

    if(tableSelection.selectedColumns.size){
      const columns=[...tableSelection.selectedColumns].sort((a,b)=>a-b);
      const lastRow=table.tBodies[0].rows.length;
      const lines=[];
      for(let row=0;row<=lastRow;row++){
        lines.push(columns.map(col=>{
          const cell=tableCellAt(row,col);
          return cell?cell.textContent.trim():'';
        }).join('\t'));
      }
      return lines.join('\n');
    }

    if(!tableSelection.anchor||!tableSelection.focus)return '';
    const r1=Math.min(tableSelection.anchor.row,tableSelection.focus.row);
    const r2=Math.max(tableSelection.anchor.row,tableSelection.focus.row);
    const c1=Math.min(tableSelection.anchor.col,tableSelection.focus.col);
    const c2=Math.max(tableSelection.anchor.col,tableSelection.focus.col);

    const lines=[];
    for(let r=r1;r<=r2;r++){
      const values=[];
      for(let c=c1;c<=c2;c++){
        const cell=tableCellAt(r,c);
        values.push(cell?cell.textContent.trim():'');
      }
      lines.push(values.join('\t'));
    }
    return lines.join('\n');
  }

  function copySelectedTableCells(event){
    const text=selectedTableText();
    if(!text)return false;

    if(event&&event.clipboardData){
      event.preventDefault();
      event.clipboardData.setData('text/plain',text);
      $('copyStatus').textContent='Copied selection';
      setTimeout(()=>{$('copyStatus').textContent='';},1600);
      return true;
    }
    writeClipboardText(text,'Copied selection');
    return true;
  }

  function selectColumn(col,event){
    const additive=event.ctrlKey||event.metaKey;
    const extending=event.shiftKey&&tableSelection.lastHeaderColumn!==null;

    tableSelection.anchor=null;
    tableSelection.focus=null;

    if(extending){
      if(!additive)tableSelection.selectedColumns.clear();
      const first=Math.min(tableSelection.lastHeaderColumn,col);
      const last=Math.max(tableSelection.lastHeaderColumn,col);
      for(let c=first;c<=last;c++)tableSelection.selectedColumns.add(c);
    }else if(additive){
      if(tableSelection.selectedColumns.has(col)){
        tableSelection.selectedColumns.delete(col);
      }else{
        tableSelection.selectedColumns.add(col);
      }
      tableSelection.lastHeaderColumn=col;
    }else{
      tableSelection.selectedColumns.clear();
      tableSelection.selectedColumns.add(col);
      tableSelection.lastHeaderColumn=col;
    }
    paintTableSelection();
  }

  function setupTableSelection(){
    const table=$('dataTab').querySelector('table');

    table.addEventListener('mousedown',event=>{
      const cell=event.target.closest('th,td');
      if(!cell)return;
      event.preventDefault();
      event.stopPropagation();

      const pos=tableCellPosition(cell);

      if(cell.tagName==='TH'){
        selectColumn(pos.col,event);
        tableSelection.active=false;
        tableSelection.suppressNextClick=true;
        return;
      }

      tableSelection.selectedColumns.clear();
      tableSelection.lastHeaderColumn=null;
      tableSelection.anchor=pos;
      tableSelection.focus=pos;
      tableSelection.active=true;
      tableSelection.suppressNextClick=true;
      paintTableSelection();
    });

    table.addEventListener('mouseover',event=>{
      if(!tableSelection.active)return;
      const cell=event.target.closest('td');
      if(!cell)return;
      tableSelection.focus=tableCellPosition(cell);
      paintTableSelection();
    });

    table.addEventListener('click',event=>{
      if(tableSelection.suppressNextClick){
        event.preventDefault();
        event.stopImmediatePropagation();
        tableSelection.suppressNextClick=false;
      }
    },true);

    document.addEventListener('mouseup',()=>{
      tableSelection.active=false;
    });

    document.addEventListener('copy',event=>{
      if(
        tableSelection.selectedColumns.size||
        (tableSelection.anchor&&tableSelection.focus)
      ){
        copySelectedTableCells(event);
      }
    });

    document.addEventListener('keydown',event=>{
      if(event.key==='Escape'){
        tableSelection.anchor=null;
        tableSelection.focus=null;
        tableSelection.selectedColumns.clear();
        tableSelection.lastHeaderColumn=null;
        clearTableSelection();
      }
    });
  }

  function tableDataAsTSV(){
    const rows=computed();
    const unit=state.calibration?.unit||'px';
    const header=[
      'Frame',
      't (s)',
      `x (${unit})`,
      `y (${unit})`,
      `vx (${unit}/s)`,
      `vy (${unit}/s)`,
      `speed (${unit}/s)`
    ];
    const lines=[header.join('\t')];
    rows.forEach(r=>{
      lines.push([
        r.frame,
        r.t.toFixed(6),
        r.x.toFixed(6),
        r.y.toFixed(6),
        r.vx.toFixed(6),
        r.vy.toFixed(6),
        r.speed.toFixed(6)
      ].join('\t'));
    });
    return lines.join('\n');
  }

  async function writeClipboardText(text,successMessage='Copied'){
    const status=$('copyStatus');
    try{
      if(navigator.clipboard && window.isSecureContext){
        await navigator.clipboard.writeText(text);
      }else{
        const area=document.createElement('textarea');
        area.value=text;
        area.setAttribute('readonly','');
        area.style.position='fixed';
        area.style.opacity='0';
        area.style.pointerEvents='none';
        area.style.left='0';
        area.style.top='0';
        document.body.appendChild(area);
        area.focus();
        area.select();
        area.setSelectionRange(0,area.value.length);
        const ok=document.execCommand('copy');
        area.remove();
        if(!ok) throw new Error('Copy command failed');
      }
      status.textContent=successMessage;
      setTimeout(()=>{status.textContent='';},1800);
      return true;
    }catch(error){
      status.textContent='Copy failed';
      alert('The browser blocked clipboard access. Select the highlighted cells and use Ctrl/Cmd+C, or use Export CSV.');
      return false;
    }
  }

  async function copyDataToClipboard(){
    await writeClipboardText(tableDataAsTSV(),'Copied full table');
  }


  // The unit string is free text. A unit containing a comma or quote used to
  // split the header row and shift every column in the exported file.
  function csvCell(value){
    const text=String(value);
    return /[",\n]/.test(text)?`"${text.replace(/"/g,'""')}"`:text;
  }
  function exportCSV(){
    const rows=computed(),u=state.calibration?.unit||'px';
    const lines=[[`frame`,`time_s`,`x_${u}`,`y_${u}`,`vx_${u}_per_s`,`vy_${u}_per_s`,`speed_${u}_per_s`],...rows.map(r=>[r.frame,r.t,r.x,r.y,r.vx,r.vy,r.speed])];
    download(new Blob([lines.map(r=>r.map(csvCell).join(',')).join('\n')],{type:'text/csv'}),'video-analysis.csv');
  }
  function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

  // Points are stored as fractions of the frame, so a video of different
  // dimensions or length reinterprets every coordinate. Warn instead of
  // silently producing wrong numbers.
  function warnOnVideoMismatch(){
    const expected=state.expectedVideo;
    if(!expected) return;
    state.expectedVideo=null;
    const sizeChanged=Number.isFinite(expected.width)&&Number.isFinite(expected.height)&&
      (expected.width!==video.videoWidth||expected.height!==video.videoHeight);
    const durationChanged=Number.isFinite(expected.duration)&&
      Math.abs(expected.duration-video.duration)>0.5;
    if(sizeChanged||durationChanged){
      alert(`This video does not match the one saved with the project${expected.name?` (${expected.name})`:''}. Tracked points may not line up with the footage.`);
    }
  }

  let currentVideoUrl=null;
  $('videoInput').addEventListener('change',e=>{
    const f=e.target.files[0];if(!f)return;
    // Each load created a blob URL that was never released, pinning the
    // previous file in memory for the life of the page.
    if(currentVideoUrl) URL.revokeObjectURL(currentVideoUrl);
    detectionRan=false;fpsWasUserSet=false;
    state.videoName=f.name;state.videoSize=f.size;
    currentVideoUrl=URL.createObjectURL(f);
    video.src=currentVideoUrl;
    video.onloadedmetadata=()=>{
      state.videoDuration=video.duration;
      warnOnVideoMismatch();
      seekFrame(0);resizeOverlay();updateUI();
    };
  });
  let playbackAnimationId=null;

  // Single implementation of the frame/time/HUD readout. It used to exist twice,
  // in updateUI and here, and the two copies had already begun to drift apart.
  function updatePlaybackIndicators(){
    const lf=lastFrame(), cf=currentFrame();
    $('frameLabel').textContent=`Frame ${cf} / ${lf}`;
    $('timeLabel').textContent=`${mediaTimeNow().toFixed(3)} s`;
    $('timelineRange').max=lf;
    $('timelineRange').value=cf;

    if(video.videoWidth){
      const calibrating=state.mode==='calibrate';
      const modeLabel=calibrating?'CALIBRATION':'TRACK MODE';
      $('hud').innerHTML=`<strong style="color:${calibrating?'#c084fc':'#38bdf8'}">${modeLabel}</strong><br>Frame: ${cf} / ${lf}<br>Time: ${mediaTimeNow().toFixed(3)} s<br>Points: ${state.points.length}`;
    }else{
      $('hud').textContent='Load a video to begin.';
    }
  }

  function animatePlayback(){
    updatePlaybackIndicators();
    if(!video.paused && !video.ended){
      playbackAnimationId=requestAnimationFrame(animatePlayback);
    }else{
      playbackAnimationId=null;
    }
  }

  video.addEventListener('timeupdate',updatePlaybackIndicators);
  video.addEventListener('seeked',()=>{resetFpsSample();updatePlaybackIndicators();draw();});
  video.addEventListener('seeking',()=>{
    // The frame on screen is about to change; the old timestamp no longer
    // describes it. Clearing here means mediaTimeNow falls back to currentTime
    // until a real frame callback arrives with the new value.
    presentedTime=null;
    resetFpsSample();
  });
  video.addEventListener('loadedmetadata',()=>{
    presentedTime=null;presentedFrames=null;measuredFps=null;pumpActive=false;
    resetFpsSample();updateFpsHint();pumpFrameCallback();
    detectFrameRate();
  });
  video.addEventListener('play',()=>{
    $('playBtn').textContent='❚❚';
    $('playBtn').title='Pause';
    $('playBtn').classList.add('active');
    if(playbackAnimationId===null) playbackAnimationId=requestAnimationFrame(animatePlayback);
  });
  video.addEventListener('pause',()=>{
    $('playBtn').textContent='▶';
    $('playBtn').title='Play';
    $('playBtn').classList.remove('active');
    updatePlaybackIndicators();
  });
  video.addEventListener('ended',updatePlaybackIndicators);
  $('playBtn').onclick=()=>video.paused?video.play():video.pause();
  $('prevBtn').onclick=()=>seekFrame(currentFrame()-state.stride);
  $('nextBtn').onclick=()=>seekFrame(currentFrame()+state.stride);
  $('fpsInput').onchange=e=>{fpsWasUserSet=true;applyFps(Number(e.target.value));};
  $('fpsHint').onclick=()=>{ if(measuredFps!=null) applyFps(Math.round(measuredFps*100)/100); };
  $('strideInput').onchange=e=>{
    state.stride=Math.min(99,Math.max(1,Math.round(Number(e.target.value)||1)));
    e.target.value=state.stride;
  };
  $('timelineRange').oninput=e=>seekFrame(Number(e.target.value));
  $('calibrateBtn').onclick=()=>{
    if(state.calibration){
      state.calibrationVisible=!state.calibrationVisible;
      draw();
    }else{
      state.calibrationDraft=[];
      state.calibrationVisible=true;
      setMode('calibrate');
    }
  };
  $('calibrateBtn').ondblclick=()=>{
    state.calibrationDraft=[];
    state.calibrationVisible=true;
    setMode('calibrate');
  };
  function syncCalibrationInputs(){
    if(!state.calibration) return;
    $('calLength').value=state.calibration.realLength;
    $('unitInput').value=state.calibration.unit;
  }
  // The length and unit were only read at the instant of the second calibration
  // click. Editing either field afterwards changed the label but left every
  // computed value on the old scale.
  function updateCalibrationFromInputs(){
    if(!state.calibration){ return; }
    const length=Number($('calLength').value);
    if(Number.isFinite(length)&&length>0){
      state.calibration.realLength=length;
      $('calLength').classList.remove('invalid');
    }else{
      $('calLength').classList.add('invalid');
    }
    state.calibration.unit=$('unitInput').value.trim()||state.calibration.unit;
    syncCalibrationInputs();
    draw();
  }
  $('calLength').addEventListener('change',updateCalibrationFromInputs);
  $('unitInput').addEventListener('change',updateCalibrationFromInputs);
  $('trackBtn').onclick=()=>{setMode('track');overlay.style.cursor='crosshair';};
  $('axesToggleBtn').onclick=()=>{
    state.axesVisible=!state.axesVisible;
    draw();
  };
  $('clearBtn').onclick=()=>{if(confirm('Clear all tracked points?')){const before=clone(state.points);state.points=[];state.selectedIndex=-1;pushAction({type:'points',before,after:[]});draw()}};
  $('pointDisplay').onchange=e=>{
    state.pointDisplay=e.target.value;
    if(state.pointDisplay==='current'){
      const exact=pointAtFrame(currentFrame());
      if(exact>=0){
        state.selectedIndex=exact;
      }else if(state.selectedIndex<0 && state.points.length){
        const candidates=state.points
          .map((p,i)=>({p,i}))
          .filter(o=>o.p.frame<=currentFrame())
          .sort((a,b)=>b.p.frame-a.p.frame);
        if(candidates.length) state.selectedIndex=candidates[0].i;
      }
    }
    draw();
  };
  $('autoAdvance').onchange=e=>state.autoAdvance=e.target.value==='1';
  $('timeOrigin').onchange=e=>{
    const oldOrigin=state.timeOrigin;
    const newOrigin=e.target.value;
    if(oldOrigin===newOrigin)return;

    // Shift derived from measured times, not from frame index over fps.
    const sorted=[...state.points].sort((a,b)=>pointTime(a)-pointTime(b));
    const firstTime=sorted.length?pointTime(sorted[0]):0;
    const oldT0=(oldOrigin==='first')?firstTime:0;
    const newT0=(newOrigin==='first')?firstTime:0;
    const timeShift=oldT0-newT0;

    state.timeOrigin=newOrigin;

    const graphType=$('graphSelect').value;
    if(state.graphLimitsManual && graphType!=='trajectory'){
      state.graphLimits.xmin+=timeShift;
      state.graphLimits.xmax+=timeShift;
      populateLimitInputs();
      updateLimitLabels();
      renderData();
      drawGraph();
    }else{
      renderData();
      autoscaleGraph();
    }
    draw();
  };
  $('graphSelect').onchange=e=>{
    e.target.blur();
    // Show whichever model belongs to the plot being switched to.
    $('fitSelect').value=currentFitModel();
    updateLimitLabels();
    autoscaleGraph();
  };
  $('autoscaleBtn').onclick=()=>{
    autoscaleGraph();
    $('scalePanel').classList.remove('open');
  };
  $('manualScaleBtn').onclick=()=>{
    populateLimitInputs();
    updateLimitLabels();
    $('scalePanel').classList.toggle('open');
  };
  $('cancelScaleBtn').onclick=()=>$('scalePanel').classList.remove('open');
  $('applyScaleBtn').onclick=()=>{
    applyGraphLimits();
    const invalid=['xMin','xMax','yMin','yMax'].some(id=>$(id).classList.contains('invalid'));
    if(!invalid) $('scalePanel').classList.remove('open');
  };
  ['xMin','xMax','yMin','yMax'].forEach(id=>{
    $(id).addEventListener('keydown',e=>{
      if(e.key==='Enter') $('applyScaleBtn').click();
    });
  });
  $('saveProjectBtn').onclick=saveProject;
  $('loadProjectBtn').onclick=()=>$('projectInput').click();
  $('projectInput').onchange=e=>{if(e.target.files[0])loadProject(e.target.files[0])};
  // One delegated handler rather than a listener per row rebuilt on every redraw.
  $('dataBody').addEventListener('click',event=>{
    const tr=event.target.closest('tr');
    if(!tr||tr.dataset.frame===undefined) return;
    const frame=Number(tr.dataset.frame);
    seekFrame(frame);
    state.selectedIndex=state.points.findIndex(p=>p.frame===frame);
    draw();
  });
  // ---- Brush selection on the graph ------------------------------------
  (function initBrush(){
    let brushing=false, start=null, current=null;

    const localPoint=e=>{
      const r=graph.getBoundingClientRect();
      return {x:e.clientX-r.left, y:e.clientY-r.top};
    };
    const insidePlot=p=>{
      if(!lastPlot) return false;
      const {m,W,H}=lastPlot;
      return p.x>=m.l&&p.x<=W-m.r&&p.y>=m.t&&p.y<=H-m.b;
    };

    graph.addEventListener('pointerdown',e=>{
      if(!lastPlot||!plottedRows.length) return;
      const p=localPoint(e);
      if(!insidePlot(p)) return;
      brushing=true;start=p;current=p;
      graph.setPointerCapture(e.pointerId);
      graph.style.cursor='crosshair';
      e.preventDefault();
    });

    graph.addEventListener('pointermove',e=>{
      if(!brushing){
        if(lastPlot) graph.style.cursor=insidePlot(localPoint(e))?'crosshair':'default';
        return;
      }
      current=localPoint(e);
      drawGraph();
      // Draw the rubber band over the freshly rendered plot.
      gctx.save();
      gctx.fillStyle='rgba(245,158,11,.14)';
      gctx.strokeStyle='rgba(245,158,11,.85)';
      gctx.lineWidth=1.5;
      const x=Math.min(start.x,current.x),y=Math.min(start.y,current.y);
      const w=Math.abs(current.x-start.x),h=Math.abs(current.y-start.y);
      gctx.fillRect(x,y,w,h);
      gctx.strokeRect(x,y,w,h);
      gctx.restore();
    });

    const finish=e=>{
      if(!brushing) return;
      brushing=false;
      graph.style.cursor='default';
      try{graph.releasePointerCapture(e.pointerId)}catch{}
      const dx=Math.abs(current.x-start.x), dy=Math.abs(current.y-start.y);
      // A click that is not a drag does nothing. It used to clear the
      // selection, which meant one stray click on the plot silently threw the
      // chosen range away and re-fitted the whole data set. Clearing is now a
      // deliberate act: the Clear selection button, or a double-click.
      if(dx<4&&dy<4){ return; }

      const x0=Math.min(start.x,current.x), x1=Math.max(start.x,current.x);
      const y0=Math.min(start.y,current.y), y1=Math.max(start.y,current.y);
      const type=$('graphSelect').value;
      const {px,py}=lastPlot;
      const picked=[];
      plottedRows.forEach(r=>{
        const vx=(type==='trajectory')?r.x:r.t;
        const vy=(type==='trajectory')?r.y:r[type];
        if(!Number.isFinite(vx)||!Number.isFinite(vy)) return;
        const X=px(vx),Y=py(vy);
        if(X>=x0&&X<=x1&&Y>=y0&&Y<=y1) picked.push(r.frame);
      });
      setSelection(picked);
      drawGraph();
    };
    graph.addEventListener('pointerup',finish);
    graph.addEventListener('pointercancel',finish);
    graph.addEventListener('dblclick',()=>{clearSelection();drawGraph();});
  })();

  // The panel floats over the plot, so it needs to be movable when it lands on
  // the data. Position is remembered for the session.
  (function initFitPanelDrag(){
    const panel=$('fitPanel');
    let dragging=false, startX=0, startY=0, baseLeft=0, baseTop=0;

    panel.addEventListener('pointerdown',e=>{
      const frame=$('graphLimits').getBoundingClientRect();
      const rect=panel.getBoundingClientRect();
      dragging=true;
      startX=e.clientX; startY=e.clientY;
      baseLeft=rect.left-frame.left; baseTop=rect.top-frame.top;
      // Switch from right/bottom anchoring to left/top so dragging is absolute.
      panel.style.left=baseLeft+'px';
      panel.style.top=baseTop+'px';
      panel.style.right='auto';
      panel.style.bottom='auto';
      panel.classList.add('dragging');
      panel.setPointerCapture(e.pointerId);
      e.preventDefault();
    });

    panel.addEventListener('pointermove',e=>{
      if(!dragging) return;
      const frame=$('graphLimits').getBoundingClientRect();
      const rect=panel.getBoundingClientRect();
      // Keep it inside the graph frame so it cannot be lost off-edge.
      const maxLeft=Math.max(0,frame.width-rect.width);
      const maxTop=Math.max(0,frame.height-rect.height);
      const left=Math.min(maxLeft,Math.max(0,baseLeft+e.clientX-startX));
      const top=Math.min(maxTop,Math.max(0,baseTop+e.clientY-startY));
      panel.style.left=left+'px';
      panel.style.top=top+'px';
    });

    const stop=e=>{
      if(!dragging) return;
      dragging=false;
      panel.classList.remove('dragging');
      try{panel.releasePointerCapture(e.pointerId)}catch{}
    };
    panel.addEventListener('pointerup',stop);
    panel.addEventListener('pointercancel',stop);
  })();

  $('fitSelect').onchange=e=>{
    e.target.blur();
    state.fitModels[$('graphSelect').value]=e.target.value;
    autoscaleGraph();
  };

  $('clearSelectionBtn').onclick=()=>{clearSelection();drawGraph();};

  $('copyDataBtn').onclick=copyDataToClipboard;
  setupTableSelection();
  $('exportCsvBtn').onclick=exportCSV;
  document.addEventListener('keydown',e=>{
    const active=document.activeElement;
    // A <select> keeps focus after you change it, which used to swallow every
    // shortcut - most visibly Delete, so points became undeletable once the
    // student had touched the graph or fit dropdown. Delete never types into a
    // select, so let it through; arrows still belong to the select.
    if(active && ['INPUT','TEXTAREA'].includes(active.tagName)) return;
    if(active && active.tagName==='SELECT'){
      if(e.key!=='Delete'&&e.key!=='Backspace') return;
      active.blur();
    }
    // A button still holding focus after a click also answers to Space, which
    // toggled playback twice.
    if(e.code==='Space' && active && active.tagName==='BUTTON') active.blur();
    if(e.code==='Space'){e.preventDefault();video.paused?video.play():video.pause()}
    // Arrow keys now step by the same stride as the transport buttons.
    else if(e.key==='ArrowRight'){e.preventDefault();seekFrame(currentFrame()+state.stride*(e.ctrlKey?10:1))}
    else if(e.key==='ArrowLeft'){e.preventDefault();seekFrame(currentFrame()-state.stride*(e.ctrlKey?10:1))}
    else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo()}
    else if((e.key==='Delete'||e.key==='Backspace')&&state.selectedIndex>=0){
      e.preventDefault();
      const before=clone(state.points);
      state.points.splice(state.selectedIndex,1);
      state.selectedIndex=-1;
      state.hoverIndex=-1;
      pushAction({type:'points',before,after:clone(state.points)});
      draw();
    }
    else if(e.key==='Home'){e.preventDefault();seekFrame(0)}
    else if(e.key==='End'){e.preventDefault();seekFrame(lastFrame())}
  });
  new ResizeObserver(resizeOverlay).observe(wrap);
  new ResizeObserver(resizeGraphCanvas).observe(graph.parentElement);
  window.addEventListener('resize',()=>{resizeOverlay();resizeGraphCanvas();});
  resizeOverlay();updateLimitLabels();resizeGraphCanvas();
})();
</script>
